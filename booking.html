    <h2>Car Booking Form</h2>
    <p>
      Fill in this form to book a car. You can see the cars and sample prices on
      the <a href="cars.html">cars page</a>.
    </p>
    <form>
      <p>
        <label
          >Full Name:<br />
          <input type="text" name="name"
        /></label>
      </p>

      <p>
        <label
          >Email Address:<br />
          <input type="text" name="email"
        /></label>
      </p>

      <p>
        <label
          >Contact Number:<br />
          <input type="text" name="phone"
        /></label>
      </p>

      <p>
        <label
          >Select a Car:<br />
          <select name="car">
            <option>-- Choose a car --</option>
            <option>Suzuki Alto</option>
            <option>Suzuki Cultus</option>
            <option>Suzuki Wagon R</option>
            <option>Suzuki Swift</option>
            <option>Toyota Yaris</option>
            <option>Toyota Corolla</option>
          </select></label
        >
      </p>

      <p>
        <label
          >Pickup Date (example: 20-10-2026):<br />
          <input type="date" name="pickup-date"
        /></label>
      </p>

      <p>
        <label
          >Return Date (example: 22-10-2026):<br />
          <input type="date" name="return-date"
        /></label>
      </p>

      <p>
        <label
          >Pickup Location:<br />
          <input type="text" name="pickup-location"
        /></label>
      </p>

      <p>
        <label
          >Return Location:<br />
          <input type="text" name="return-location"
        /></label>
      </p>

      <p>
        <label
          >Any Message:<br />
          <textarea name="message" cols="40" rows="5"></textarea>
        </label>
      </p>

      <p>
        <input type="submit" value="Send Booking Request" />
      </p>
    </form>

    <hr />

      Uway Cars | Author : Awais Afzal | INFT251103050 | KFUEIT
    </p>
